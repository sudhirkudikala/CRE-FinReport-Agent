# ====================================================================================
# PAfE/PAX Intelligent Orchestrator: Sequential Task Blueprint
# Establishes data-lineage handovers, functional boundaries, and compliance guardrails.
# ====================================================================================

parse_telemetry_task:
  description: >
    Inbound diagnostic telemetry tracking task. 
    Analyze the raw spreadsheet discrepancy or PAX task pane exception report for 
    Business Unit {business_unit} at intersection {target_intersection} for measure {measure}.
    
    EXECUTION SEQUENCE:
    1. Invoke the 'MCP Multi-Dimensional MDX Query Engine' tool to programmatically compile 
       the target intersection parameters.
    2. Inspect the tool response JSON schema and extract the 'status' tag.
    3. Isolate the number of uncommitted data transactions by reading the 'dirty_cells_in_memory_slice' metric.
    4. Pass the entire parsed structural JSON object downstream. Do NOT calculate variances locally.
  expected_output: >
    A verified technical JSON payload containing the structured MDX query string, data cache signatures, 
    and underlying cell states (CLEAN or DIRTY) compiled natively via the database engine handshake.
  agent: telemetry_parser

match_underwriting_task:
  description: >
    Financial context evaluation pass. 
    Review the technical output metadata payload generated by the parse_telemetry_task to assess its 
    impact on Commercial Real Estate (CRE) Private Equity underwriting models and portfolio rollups.
    
    CRITICAL CRAG CONTROL PATH:
    1. Pass the entire preceding tool output string directly into the 
       'Deterministic CRAG Grading Layer Engine' tool to verify compliance.
    2. Read the returned 'action_directive' output value string carefully.
    3. Evaluate financial materiality: check if the 'evaluation_status' indicates a MATERIALITY_BREACH 
       or a VOLATILE_MEMORY_LOCK (uncommitted dirty cells).
    4. Enforce strict routing: append the exact 'action_directive' results into the task execution 
       history using the token strings [STATUS: AUTOMATED_PATCH] or [STATUS: HUMAN_REVIEW_REQUIRED] 
       to govern downstream resolution logic.
  expected_output: >
    A concise Business Risk Impact Statement detailing identified dimension misalignment drivers, 
    materiality status, and the explicit structural execution routing tag.
  agent: underwriting_matcher

generate_resolution_task:
  description: >
    Remediation engineering pass. 
    Analyze the preceding Business Risk Impact Statement and technical telemetry to determine the 
    safest non-destructive operational resolution blueprint.
    
    COMPLIANCE RULES:
    1. IF the context contains the [STATUS: HUMAN_REVIEW_REQUIRED] tag, or if the underlying 
       telemetry status reads 'API_TIMEOUT' or 'SYSTEM_CRITICAL_UNKNOWN', you must instantly halt automated tracking.
    2. Invoke the 'ServiceNow Ticket and Executive Email Escalator' tool to generate a P1 incident report 
       and send a priority email relay to the Cube Owner.
    3. IF the cell state is DIRTY, do NOT execute automated writebacks to production cubes.
    4. Retain and record the final tracking confirmation payload.
  expected_output: >
    A formalized technical remediation playbook outlining safe, step-by-step local cache clearing 
    actions OR an authenticated confirmation string mapping out the ServiceNow ticket numbers and SMTP queue indexes.
  agent: epm_resolution_engine

format_output_task:
  description: >
    Executive reporting pass. 
    Consolidate the entire multi-agent diagnostic run, risk matrix, and technical resolution blueprint 
    into a polished final systems summary briefing.
    
    FORMATTING TOPOLOGY:
    - Hide raw Python exceptions, empty tokens, or raw JSON snippets.
    - Structure your response to speak to Regional CFOs, Controllers, and Private Equity managers.
    - Present the MDX code strings, cache hit states, tracking ticket indices, and immediate 
      action items inside highly scannable, clean markdown tables.
  expected_output: >
    An elegant Executive Systems Summary Markdown document optimized for leadership oversight, containing 
    clear, structured tables detailing root-cause, materiality risk level, and resolution progress tracking.
  agent: executive_synthesis_bot
